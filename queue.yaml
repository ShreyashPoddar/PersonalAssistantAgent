# PAA GPU queue — this file lives on branch `gpu-queue` (never merge or delete that branch). Edit it on GitHub from
# anywhere, even your phone, or with `python tools/gpu.py ...` from the laptop. The DGX poller reads it every 3 min.
#
# jobs: each NEW id runs once. Fields:
#   id      unique, single-use (letters, digits, - _)
#   step    gen_data | train | eval | export          (nothing else can run)
#   ref     commit SHA on main of PersonalAssistantAgent (only merged code runs)
#   out     output name under ~/paa/artifacts (default = id). Reuse an old out + resume: true to continue a job.
#   after   out name this job reads (train after gen_data, eval/export after train); waits until it is done
#   gpus    0/1/2 (default: export 0, others 1)
#   args    extra flags for the train/ script, e.g. "--n 20000" or "--base google/gemma-3-270m-it --epochs 4"
#
# control: change `status` to any new value -> status post; add an id to `logs` -> its log tail; to `stop` -> stop it.
jobs:
  # - {id: data-v1,       step: gen_data, ref: <main-sha>, args: "--n 20000"}
  # - {id: train-1b-v1,   step: train,    ref: <main-sha>, after: data-v1, args: "--base google/gemma-3-1b-it"}
  # - {id: train-270m-v1, step: train,    ref: <main-sha>, after: data-v1, args: "--base google/gemma-3-270m-it --epochs 4"}
  # - {id: eval-1b-v1,    step: eval,     ref: <main-sha>, after: train-1b-v1}
  # - {id: export-1b-v1,  step: export,   ref: <main-sha>, after: train-1b-v1, args: "--size 1b --tag v1"}
  - {id: data-v1, step: gen_data, ref: 79253744f648, args: "--n 20000"}
  - {id: data-v1b, step: gen_data, ref: 98b1c8cb07de, out: data-v1, resume: true, args: "--n 20000"}
  - {id: export-1b-v1, step: export, ref: 768c1bcbe6cb, after: train-1b-v1, args: "--size 1b --tag v1"}
  - {id: chain-1b-v1b, step: train, ref: f6827de3d786, out: train-1b-v1, after: data-v1, args: "--base google/gemma-3-1b-it --then-eval eval-1b-v1 --hold"}
  - {id: chain-270m-v1b, step: train, ref: f6827de3d786, out: train-270m-v1, after: data-v1, args: "--base google/gemma-3-270m-it --epochs 4 --then-eval eval-270m-v1 --hold"}
  - {id: export-1b-v1b, step: export, ref: 0b1de974054b, out: export-1b-v1, after: train-1b-v1, args: "--size 1b --tag v1"}
  - {id: export-1b-v1c, step: export, ref: eaedaf84a139, out: export-1b-v1, after: train-1b-v1, args: "--size 1b --tag v1"}
  - {id: export-270m-v1c, step: export, ref: eaedaf84a139, out: export-270m-v1, after: train-270m-v1, args: "--size 270m --tag v1"}
  - {id: data-v2, step: gen_data, ref: eaedaf84a139, args: "--n 20000"}
  - {id: chain-1b-v2, step: train, ref: eaedaf84a139, out: train-1b-v2, after: data-v2, args: "--base google/gemma-3-1b-it --then-eval eval-1b-v2 --hold"}
  - {id: chain-270m-v2, step: train, ref: eaedaf84a139, out: train-270m-v2, after: data-v2, args: "--base google/gemma-3-270m-it --epochs 4 --then-eval eval-270m-v2 --hold"}
  - {id: export-1b-v2, step: export, ref: eaedaf84a139, after: train-1b-v2, args: "--size 1b --tag v2"}
  - {id: export-270m-v2, step: export, ref: eaedaf84a139, after: train-270m-v2, args: "--size 270m --tag v2"}
  - {id: data-v3, step: gen_data, ref: a610fa901a22, args: "--n 25000 --seed 3"}
  - {id: chain-1b-v3, step: train, ref: a610fa901a22, out: train-1b-v3, after: data-v3, args: "--base google/gemma-3-1b-it --then-eval eval-1b-v3 --hold"}
  - {id: chain-270m-v3, step: train, ref: a610fa901a22, out: train-270m-v3, after: data-v3, args: "--base google/gemma-3-270m-it --epochs 4 --then-eval eval-270m-v3 --hold"}
  - {id: export-1b-v3, step: export, ref: 2eb30b8a979c, after: train-1b-v3, args: "--size 1b --tag v3"}
  - {id: export-270m-v3, step: export, ref: 2eb30b8a979c, after: train-270m-v3, args: "--size 270m --tag v3"}
  - {id: export-1b-v2-q4b, step: export, ref: 91e10fe3cdde, out: export-1b-v2-q4, after: train-1b-v2, args: "--size 1b --tag v2q4 --quantize dynamic_int4_block32 --prefill 32,128,512 --kv 768"}
  - {id: eval-1b-v3-dbg, step: eval, ref: f9716d264b4f, out: eval-1b-v3-dbg, after: train-1b-v3}
  - {id: eval-1b-v3-b1, step: eval, ref: 04eb50eb893c, out: eval-1b-v3-b1, after: train-1b-v3, args: "--batch 1"}
  - {id: eval-270m-v3-b1, step: eval, ref: ab351064f407, out: eval-270m-v3-b1, after: train-270m-v3}
  - {id: data-v4, step: gen_data, ref: aa222cb73992, args: "--n 25000 --seed 4"}
  - {id: chain-1b-v4, step: train, ref: 92a5cef20aac, out: train-1b-v4, after: data-v4, args: "--base google/gemma-3-1b-it --then-eval eval-1b-v4 --hold"}
  - {id: chain-270m-v4, step: train, ref: 92a5cef20aac, out: train-270m-v4, after: data-v4, args: "--base google/gemma-3-270m-it --epochs 4 --then-eval eval-270m-v4 --hold"}
  - {id: export-1b-v4, step: export, ref: 92a5cef20aac, after: train-1b-v4, args: "--size 1b --tag v4"}
  - {id: export-270m-v4, step: export, ref: 92a5cef20aac, after: train-270m-v4, args: "--size 270m --tag v4"}
  - {id: data-v5, step: gen_data, ref: 9980338, args: "--n 25000 --seed 5"}
  - {id: chain-1b-v5, step: train, ref: 9980338, out: train-1b-v5, after: data-v5, args: "--base google/gemma-3-1b-it --then-eval eval-1b-v5 --hold"}
  - {id: chain-270m-v5, step: train, ref: 9980338, out: train-270m-v5, after: data-v5, args: "--base google/gemma-3-270m-it --epochs 4 --then-eval eval-270m-v5 --hold"}
  - {id: export-1b-v5, step: export, ref: 9980338, after: train-1b-v5, args: "--size 1b --tag v5"}
  - {id: export-270m-v5, step: export, ref: 9980338, after: train-270m-v5, args: "--size 270m --tag v5"}
control: {status: 16, logs: [data-v1b, chain-1b-v1b, chain-270m-v1b, chain-1b-v2, chain-1b-v3], stop: [chain-270m-v4, chain-270m-v5]}
